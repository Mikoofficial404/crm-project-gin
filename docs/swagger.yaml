basePath: /api/v1
definitions:
  entity.StageOrder:
    properties:
      order:
        type: integer
      stage_id:
        type: string
    type: object
  response.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  response.PaginatedResponse:
    properties:
      data: {}
      message:
        type: string
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.Response:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  v1.AddCommentRequest:
    properties:
      content:
        type: string
      mentioned_user_ids:
        items:
          type: string
        type: array
    required:
    - content
    type: object
  v1.AddMemberRequest:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  v1.AddRecipientsRequest:
    properties:
      ids:
        items:
          type: string
        minItems: 1
        type: array
      type:
        enum:
        - leads
        - contacts
        type: string
    required:
    - ids
    - type
    type: object
  v1.AssignProductRequest:
    properties:
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
      unit_price:
        minimum: 0
        type: number
    required:
    - product_id
    - quantity
    - unit_price
    type: object
  v1.CreateActivity:
    properties:
      attachment:
        type: string
      leadID:
        type: string
      notes:
        type: string
      type:
        type: string
    required:
    - leadID
    - notes
    - type
    type: object
  v1.CreateCampaignRequest:
    properties:
      body:
        type: string
      name:
        type: string
      subject:
        type: string
    required:
    - body
    - name
    - subject
    type: object
  v1.CreateContactRequest:
    properties:
      company:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      position:
        type: string
    required:
    - name
    - phone
    type: object
  v1.CreateDealRequest:
    properties:
      leadId:
        type: string
      name:
        type: string
      pipelineId:
        type: string
      stageId:
        type: string
      value:
        type: number
    required:
    - leadId
    - name
    - pipelineId
    - stageId
    - value
    type: object
  v1.CreateLeadRequest:
    properties:
      custom_fields:
        additionalProperties: true
        type: object
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - custom_fields
    - email
    - name
    - phone
    type: object
  v1.CreatePipelineRequest:
    properties:
      description:
        type: string
      is_default:
        type: boolean
      name:
        type: string
    required:
    - name
    type: object
  v1.CreateProductRequest:
    properties:
      description:
        type: string
      name:
        type: string
      price:
        minimum: 0
        type: number
      unit:
        type: string
    required:
    - name
    - price
    type: object
  v1.CreateStageRequest:
    properties:
      color:
        type: string
      is_closed_lost:
        type: boolean
      is_closed_won:
        type: boolean
      name:
        type: string
      probability:
        type: integer
    required:
    - name
    type: object
  v1.CreateTaskRequest:
    properties:
      category:
        type: string
      description:
        type: string
      due_date:
        type: string
      lead_id:
        type: string
      priority:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  v1.CreateTeamRequest:
    properties:
      description:
        type: string
      manager_id:
        type: string
      name:
        type: string
    required:
    - manager_id
    - name
    type: object
  v1.ForgetPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  v1.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  v1.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  v1.ReorderRequest:
    properties:
      deal_ids:
        items:
          type: string
        type: array
    required:
    - deal_ids
    type: object
  v1.ReorderStagesRequest:
    properties:
      stages:
        items:
          $ref: '#/definitions/entity.StageOrder'
        type: array
    required:
    - stages
    type: object
  v1.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  v1.ScheduleCampaignRequest:
    properties:
      scheduled_at:
        type: string
    required:
    - scheduled_at
    type: object
  v1.SendReplyRequest:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  v1.UpdateActivityRequest:
    properties:
      notes:
        type: string
    required:
    - notes
    type: object
  v1.UpdateCampaignRequest:
    properties:
      body:
        type: string
      name:
        type: string
      subject:
        type: string
    type: object
  v1.UpdateContactRequest:
    properties:
      assigned_to:
        type: string
      company:
        type: string
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      position:
        type: string
    type: object
  v1.UpdateDealRequest:
    properties:
      name:
        type: string
      value:
        type: number
    required:
    - name
    - value
    type: object
  v1.UpdateInvoiceStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  v1.UpdateLeadRequest:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
    required:
    - email
    - name
    - phone
    type: object
  v1.UpdatePipelineRequest:
    properties:
      description:
        type: string
      is_active:
        type: boolean
      is_default:
        type: boolean
      name:
        type: string
      probability:
        type: integer
    type: object
  v1.UpdatePipelineStageRequest:
    properties:
      color:
        type: string
      is_closed_lost:
        type: boolean
      is_closed_won:
        type: boolean
      name:
        type: string
      probability:
        type: integer
    type: object
  v1.UpdateProductRequest:
    properties:
      description:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      price:
        type: number
      unit:
        type: string
    type: object
  v1.UpdateStageRequest:
    properties:
      stage_id:
        type: string
    required:
    - stage_id
    type: object
  v1.UpdateStatusReques:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  v1.UpdateTaskRequest:
    properties:
      category:
        type: string
      description:
        type: string
      due_date:
        type: string
      priority:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  v1.UpdateTeamRequest:
    properties:
      description:
        type: string
      manager_id:
        type: string
      name:
        type: string
    type: object
  v1.VerifyOTPRequest:
    properties:
      otp_code:
        type: string
      user_id:
        type: string
    required:
    - otp_code
    - user_id
    type: object
host: localhost:8080
info:
  contact:
    email: support@crm.com
    name: CRM Support
  description: API untuk sistem CRM (Customer Relationship Management)
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: CRM Project API
  version: "1.0"
paths:
  /activities:
    post:
      consumes:
      - application/json
      parameters:
      - description: Data aktivitas
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateActivity'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Buat aktivitas baru
      tags:
      - Activities
  /activities/{id}:
    delete:
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Hapus aktivitas
      tags:
      - Activities
    put:
      consumes:
      - application/json
      parameters:
      - description: Activity ID
        in: path
        name: id
        required: true
        type: string
      - description: Data update aktivitas
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update aktivitas
      tags:
      - Activities
  /activities/{lead_id}:
    get:
      parameters:
      - description: Lead ID
        in: path
        name: lead_id
        required: true
        type: string
      - default: 1
        description: Halaman
        in: query
        name: page
        type: integer
      - default: 10
        description: Limit per halaman
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginatedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List aktivitas by lead
      tags:
      - Activities
  /admin/users:
    get:
      description: Ambil daftar semua user (admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get semua users
      tags:
      - admin
  /analytics/forecasting:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get analytics forecasting
      tags:
      - Dashboard
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Kirim email reset password
      parameters:
      - description: Email user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.ForgetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: Lupa password
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset password dengan token dari email
      parameters:
      - description: Token dan password baru
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      summary: Reset password
      tags:
      - auth
  /campaigns:
    get:
      description: Ambil semua campaign email (admin only)
      parameters:
      - description: Filter status (DRAFT/SCHEDULED/SENDING/SENT)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Daftar campaign
      tags:
      - campaigns
    post:
      consumes:
      - application/json
      description: Buat campaign email baru (admin only)
      parameters:
      - description: Data campaign
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateCampaignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Buat campaign email
      tags:
      - campaigns
  /campaigns/{id}:
    delete:
      description: Hapus campaign (hanya DRAFT, admin only)
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Hapus campaign
      tags:
      - campaigns
    get:
      description: Ambil detail campaign berdasarkan ID (admin only)
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Detail campaign
      tags:
      - campaigns
    patch:
      consumes:
      - application/json
      description: Update data campaign (hanya DRAFT, admin only)
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: string
      - description: Data update campaign
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateCampaignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update campaign
      tags:
      - campaigns
  /campaigns/{id}/recipients:
    get:
      description: Ambil daftar penerima campaign dengan pagination (admin only)
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Halaman (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Jumlah per halaman (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginatedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List penerima campaign
      tags:
      - campaigns
    post:
      consumes:
      - application/json
      description: Tambah leads atau contacts sebagai penerima campaign (admin only)
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: string
      - description: Data penerima
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.AddRecipientsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Tambah penerima campaign
      tags:
      - campaigns
  /campaigns/{id}/schedule:
    post:
      consumes:
      - application/json
      description: Jadwalkan campaign email untuk dikirim di waktu tertentu (admin
        only)
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: string
      - description: Waktu jadwal (RFC3339)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.ScheduleCampaignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Jadwalkan campaign
      tags:
      - campaigns
  /campaigns/{id}/send:
    post:
      description: Kirim campaign email ke semua penerima (admin only)
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Kirim campaign
      tags:
      - campaigns
  /campaigns/{id}/stats:
    get:
      description: Ambil statistik pengiriman campaign (total, terkirim, gagal, pending)
        (admin only)
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Statistik campaign
      tags:
      - campaigns
  /contacts:
    get:
      description: Ambil daftar contacts dengan filter dan pagination
      parameters:
      - description: Halaman (default 1)
        in: query
        name: page
        type: integer
      - description: Jumlah per halaman (default 10)
        in: query
        name: limit
        type: integer
      - description: Kata kunci pencarian
        in: query
        name: search
        type: string
      - description: Filter source (whatsapp/manual)
        in: query
        name: source
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.PaginatedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List contacts
      tags:
      - contacts
    post:
      consumes:
      - application/json
      description: Buat contact baru ke sistem
      parameters:
      - description: Data contact
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.CreateContactRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Buat contact baru
      tags:
      - contacts
  /contacts/{id}:
    delete:
      description: Soft delete contact berdasarkan ID
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Hapus contact
      tags:
      - contacts
    get:
      description: Ambil detail contact berdasarkan ID
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Detail contact
      tags:
      - contacts
    patch:
      consumes:
      - application/json
      description: Update data contact secara partial
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: string
      - description: Data yang diupdate
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateContactRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update contact
      tags:
      - contacts
  /contacts/{id}/restore:
    patch:
      description: Restore contact yang sudah di-soft delete
      parameters:
      - description: Contact ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Restore contact
      tags:
      - contacts
  /contacts/export:
    get:
      description: Download daftar contacts dalam format CSV
      parameters:
      - description: Filter source (whatsapp/manual)
        in: query
        name: source
        type: string
      produces:
      - text/csv
      responses:
        "200":
          description: OK
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Export contacts ke CSV
      tags:
      - contacts
  /contacts/import:
    post:
      consumes:
      - multipart/form-data
      description: Upload file CSV untuk import contacts secara massal
      parameters:
      - description: File CSV
        in: formData
        name: file
        required: true
        type: file
