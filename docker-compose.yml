version: "3.8"

services:
  crm-postgres:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-crm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-crm_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - crm-pg-data:/var/lib/postgresql/data
    networks:
      - crm-network

  crm-redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - crm-redis-data:/data
    networks:
      - crm-network

  prometheus:
    image: prom/prometheus:latest
    container_name: crm_prometheus
    restart: always
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - crm-prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - crm-network

  grafana:
    image: grafana/grafana:latest
    container_name: crm_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
    volumes:
      - crm-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - crm-network

volumes:
  crm-pg-data:
  crm-redis-data:
  crm-prometheus-data:
  crm-grafana-data:

networks:
  crm-network:
    driver: bridge
